    <!-- Session 43: installed-app launch (Claude Design "Ybex App Icon & Splash", 4b + launch animation).
         Plain HTML/CSS so it plays while the app files are still downloading. Only in the installed
         app (home-screen / TWA), once per app session. The exit (shrink into the home banner) is run by
         src/components/layout/AppLaunchSplash.jsx through window.__ybSplash. -->
    <script>
      /* v292: installed phone app, first open of the session -> the splash gradient is the page background
         from the first paint, so the launch image never flashes grey / flat purple before the splash. */
      try { var yS = !!window.Capacitor /* v335: iPhone app */ || window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
        if (yS && window.innerWidth < 768 && sessionStorage.getItem("yb_splash_seen") !== "1") document.documentElement.classList.add("yb-splash-active");
        /* Session 57 (Ravi: "direct apna animation"): Android's own launch screen is now plain #7E00DC with
           nothing on it; on Android the animation starts from that same flat purple and the gradient fades in. */
        if (/Android/i.test(navigator.userAgent || "")) document.documentElement.classList.add("yb-android"); } catch (e) {}
    </script>

         this shell stays hidden under it. It disappears as soon as React draws the real screen into #root. */
      try { if (window.innerWidth < 768 && localStorage.getItem("ybex_token") && !document.documentElement.classList.contains("yb-splash-active")) document.documentElement.classList.add("yb-shell-on"); } catch (e) {}

    <script>
      (function () {
        var el = document.getElementById("yb-splash");
        var installed = false, seen = false;
        try {
          installed = !!window.Capacitor /* v335: iPhone app */ || window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
          seen = sessionStorage.getItem("yb_splash_seen") === "1";
        } catch (e) {}
        if (!el || !installed || seen || window.innerWidth >= 768) { if (el) el.remove(); try { document.documentElement.classList.remove("yb-splash-active"); } catch (e) {} return; }
        try { sessionStorage.setItem("yb_splash_seen", "1"); } catch (e) {}
        el.hidden = false;
        el.style.setProperty("--k", (Math.min(window.innerWidth * 0.62, 300) / 241.8).toFixed(3));
        var root = document.documentElement, meta = document.querySelector('meta[name="theme-color"]');
        var yAnd = root.classList.contains("yb-android"); // Session 58: Android starts from the flat #7E00DC of its own launch screen
        root.style.backgroundColor = "#9B00FF"; if (meta) meta.setAttribute("content", yAnd ? "#7E00DC" : "#9B00FF");
        try { document.body.style.backgroundColor = "#9B00FF"; } catch (e) {} // v286: strip purple, not white
        try { root.classList.add("yb-splash-active"); document.body.classList.add("yb-splash-active"); } catch (e) {}
        var t0 = Date.now(), reduce = false, gone = false;
        try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
        // v297 (Ravi: "pehle logo aa raha hai, phir animation — do baar"): the phone's launch image is now ONLY the
        // purple gradient (no word), and the page starts the Claude Design "Ybex App Flow" intro at once:
        // camera pops in -> swings -> flash -> the flash becomes the dot of "Ybex." -> shine. "Ybex." is on
        // screen one time only. HOLD = 40 ms, just so the first purple frame paints and the pop-in can animate.
        // Reduced motion: no animation, the word is simply shown (".st").
        var HOLD = 40, INTRO = reduce ? 200 : HOLD + 1210;
        el.className = reduce ? "st" : "";
        if (!reduce) {
          [[HOLD, "go p1"], [HOLD + 300, "p2"], [HOLD + 660, "p3"], [HOLD + 740, "p4"], [HOLD + 860, "p5"]].forEach(function (s) {
            setTimeout(function () {
              if (gone) return;
              if (s[1].indexOf("go") === 0) el.classList.remove("st");
              s[1].split(" ").forEach(function (c) { el.classList.add(c); });
            }, s[0]);
          });
          // v367 (Ravi: "timing zyada ho to Ybex pe shine chalta rahe"): while the app is still loading after the
          // intro, the shine sweeps "Ybex." again every 1.4 s until the splash leaves.
          var sh = el.querySelector(".sh");
          var shineAgain = function () {
            if (gone || !sh || el.classList.contains("x")) return;
            sh.style.transition = "none"; sh.style.transform = "translateX(-400px)";
            void sh.getBoundingClientRect();
            sh.style.transition = "transform 340ms cubic-bezier(.4,0,.2,1)"; sh.style.transform = "translateX(1400px)";
            setTimeout(shineAgain, 1400);
          };
          setTimeout(shineAgain, HOLD + 860 + 1400);
        }
        function remove() {
          if (gone) return; gone = true; el.remove();
          root.style.backgroundColor = "";
          try { document.body.style.backgroundColor = ""; } catch (e) {}
          try { root.classList.remove("yb-splash-active"); document.body.classList.remove("yb-splash-active"); } catch (e) {}
          try { window.dispatchEvent(new Event("ybex:splash-done")); } catch (e) {}
        }
        // mode "up": logged out → the purple slides up and the login screen drops in.
        // target element: logged in → the purple shrinks into the home banner.  Neither → fade.
        function exit(target, mode) {
          if (gone || el.classList.contains("x")) return;
          var wait = Math.max(0, INTRO - (Date.now() - t0));
          setTimeout(function () {
            var p = el.querySelector(".p"), w = el.querySelector(".w");
            el.classList.add("x");
            if (mode === "up" && !reduce) {
              try { window.dispatchEvent(new Event("ybex:splash-up")); } catch (e) {}
              el.style.pointerEvents = "none"; root.style.backgroundColor = "";
              p.style.transition = "transform 280ms cubic-bezier(.5,0,.75,0)"; p.style.transform = "translateY(-102%)";
              setTimeout(remove, 300); return;
            }
            var r = target && target.getBoundingClientRect && target.getBoundingClientRect();
            var ok = r && r.width > 40 && r.height > 20 && r.top >= 0 && r.bottom <= window.innerHeight;
            if (!ok || reduce) {
              if (mode === "up") { try { window.dispatchEvent(new Event("ybex:splash-up")); } catch (e) {} }
              el.style.transition = "opacity 280ms cubic-bezier(.22,1,.36,1)"; el.style.opacity = "0";
              el.style.pointerEvents = "none"; setTimeout(remove, 300); return;
            }
            var ease = "380ms cubic-bezier(.65,0,.35,1)";                       // shrink into the banner
            var rad = window.getComputedStyle(target).borderRadius || "22px";
            p.style.transition = "top " + ease + ",left " + ease + ",width " + ease + ",height " + ease + ",border-radius " + ease;
            p.style.top = r.top + "px"; p.style.left = r.left + "px";
            p.style.width = r.width + "px"; p.style.height = r.height + "px"; p.style.borderRadius = rad;
            w.style.transition = "transform " + ease + ", opacity 200ms ease-out 180ms";
            w.style.transform = "translate(-50%,-50%) scale(.5)"; w.style.opacity = "0";
            setTimeout(function () {                                           // hand off to the real banner
              el.style.pointerEvents = "none";
              el.style.transition = "opacity 320ms cubic-bezier(.22,1,.36,1)"; el.style.opacity = "0";
              setTimeout(remove, 340);
            }, 400);
          }, wait);
        }
        window.__ybSplash = { exit: exit, readyAt: t0 + INTRO };
        setTimeout(function () { exit(null, "up"); }, 9000);                 // never get stuck
        setTimeout(remove, 10500);
      })();
    </script>
